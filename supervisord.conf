[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:wa_bridge]
command=node server.js
directory=/app/wa_bridge
autostart=true
autorestart=true
startretries=5
stderr_logfile=/var/log/supervisor/wa_bridge.err.log
stdout_logfile=/var/log/supervisor/wa_bridge.out.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

[program:haven_server]
command=python server.py
directory=/app
autostart=true
autorestart=true
startretries=5
stderr_logfile=/var/log/supervisor/haven_server.err.log
stdout_logfile=/var/log/supervisor/haven_server.out.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
